<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Absolute List</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    :root {
      --bg: #0d0f12;
      --card-bg: #161920;
      --card-border: #232733;
      --accent: #00d2ff;
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --gold: #ffd700;
      --red-neon: #ff2a6d;
      --blue-neon: #05d9e8;
    }

    body.theme-lava { --bg: #120909; --card-bg: #201313; --card-border: #381f1f; --accent: #ff4757; }
    body.theme-doki { --bg: #140d12; --card-bg: #20161d; --card-border: #382333; --accent: #ff75a0; }
    body.theme-geode { --bg: #09120d; --card-bg: #132017; --card-border: #1f3825; --accent: #2ed573; }
    body.theme-cyber { --bg: #0d0b14; --card-bg: #181424; --card-border: #2a223d; --accent: #eccc68; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; transition: background 0.3s; }
    
    header { 
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, var(--bg) 100%); 
      padding: 20px 15px 10px 15px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    }
    
    .header-title { 
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.8rem; 
      text-transform: uppercase; 
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .top-menu-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1.6rem;
      cursor: pointer;
      padding: 5px;
    }

    .theme-selector {
      position: absolute;
      top: 18px;
      left: 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 8px;
      outline: none;
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      width: 100%;
      max-width: 650px;
      justify-content: space-around;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 15px;
      border-radius: 10px;
    }
    .stat-item { text-align: center; }
    .stat-val { font-size: 1rem; font-weight: bold; color: var(--accent); }
    .stat-lbl { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }

    .search-container { max-width: 650px; margin: 15px auto 5px auto; padding: 0 15px; }
    .search-input { width: 100%; padding: 10px 15px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; color: #fff; font-size: 0.85rem; outline: none; }

    .nav-tabs { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
    .tab-btn { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); padding: 9px 16px; border-radius: 20px; font-weight: bold; font-size: 0.82rem; cursor: pointer; flex: 1; max-width: 180px; text-align: center; }
    .tab-btn.active { background: var(--card-border); color: #fff; border-color: var(--accent); }

    .container { max-width: 650px; margin: 0 auto; padding: 0 15px; }
    .section { display: none; }
    .section.active { display: block; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid var(--card-border); cursor: pointer; position: relative; }
    .card.top-gold { border: 2px solid var(--gold); box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); }

    .rank { font-size: 1.3rem; font-weight: bold; min-width: 45px; text-align: center; }
    .thumb { width: 90px; height: 58px; border-radius: 8px; object-fit: cover; background: #000; flex-shrink: 0; transition: transform 0.2s; }
    .thumb:hover { transform: scale(1.04); }

    .info { flex-grow: 1; overflow: hidden; }
    .info-header { display: flex; align-items: center; gap: 6px; }
    .info h3 { font-size: 1rem; color: #fff; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; margin: 0; }
    .demon-icon { width: 22px; height: 22px; object-fit: contain; flex-shrink: 0; }

    .info .meta-small { font-size: 0.72rem; color: var(--text-dim); }
    .info .meta-small b { color: #d1d5db; }

    .gold-badge { font-size: 0.7rem; color: var(--gold); font-weight: bold; display: block; margin-top: 2px; }

    .fab { position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; background: var(--card-bg); color: white; border-radius: 50%; border: 1px solid var(--accent); font-size: 1.8rem; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 90; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-content { background: var(--card-bg); width: 100%; max-width: 450px; padding: 20px; border-radius: 12px; border: 1px solid var(--card-border); max-height: 90vh; overflow-y: auto; }
    .modal-content h2 { margin-bottom: 15px; color: #fff; font-size: 1.2rem; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-dim); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--card-border); background: #0d0f12; color: white; outline: none; font-size: 0.85rem; }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit { background: var(--accent); color: #000; }
    .btn-cancel { background: #161920; color: var(--text-dim); border: 1px solid var(--card-border); }

    .roulette-icon-img { width: 24px; height: 24px; object-fit: contain; }

    .detail-img { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background: #000; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--card-border); font-size: 0.82rem; }
    .detail-row span { color: var(--text-dim); }
    .detail-row b { color: #fff; }

    .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-top: 10px; background: #000; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <header>
    <select class="theme-selector" onchange="changeTheme(this.value)">
      <option value="default">Absoluto Neon</option>
      <option value="lava">Lava / Slaughterhouse</option>
      <option value="doki">Doki Soft</option>
      <option value="geode">Geode GD</option>
      <option value="cyber">Cyberpunk</option>
    </select>

    <button class="top-menu-btn" onclick="openModal('modal-menu')">•••</button>

    <div class="header-title">LA ABSOLUTE LIST</div>

    <div class="stats-bar">
      <div class="stat-item"><div class="stat-val" id="stat-total-levels">0</div><div class="stat-lbl">Absolute Levels</div></div>
      <div class="stat-item"><div class="stat-val" id="stat-total-real">0</div><div class="stat-lbl">Top Rateados</div></div>
      <div class="stat-item"><div class="stat-val" id="stat-total-players">0</div><div class="stat-lbl">Jugadores</div></div>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="search-bar" class="search-input" placeholder="🔍 Buscar nivel, autor, jugador o ID..." oninput="render()">
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-levels-btn" onclick="switchTab('levels')">Absolute Levels</button>
    <button class="tab-btn" id="tab-real-btn" onclick="switchTab('real')">🔥 Top Rateados</button>
    <button class="tab-btn" id="tab-players-btn" onclick="switchTab('players')">👑 Top Jugadores</button>
  </div>

  <div class="container">
    <div id="levels-section" class="section active"><div id="levels-list"></div></div>
    <div id="real-section" class="section"><div id="real-list"></div></div>
    <div id="players-section" class="section"><div id="players-list"></div></div>
  </div>

  <button class="fab" onclick="startAddProcess()">+</button>

  <!-- Modal Menú "•••" -->
  <div id="modal-menu" class="modal">
    <div class="modal-content">
      <h2>Opciones de la Lista</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-cancel" onclick="openModal('modal-roulette')">
          <svg class="roulette-icon-img" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20M12 12l7-7M12 12l-7 7"/></svg>
          🎰 Modos Ruleta
        </button>
        <button class="btn btn-cancel" onclick="exportData()">💾 Exportar Backup</button>
        <button class="btn btn-cancel" onclick="importData()">📥 Importar Backup</button>
        <button class="btn btn-cancel" onclick="showChangelog()">📜 Ver Historial</button>
      </div>
      <div class="modal-actions" style="margin-top:15px;"><button class="btn btn-submit" onclick="closeModal('modal-menu')">Cerrar</button></div>
    </div>
  </div>

  <!-- Modal Ruleta -->
  <div id="modal-roulette" class="modal">
    <div class="modal-content">
      <h2>🎰 Ruleta de Niveles</h2>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <button class="btn btn-cancel" onclick="spinRoulette('mine')">Girar en "Absolute Levels"</button>
        <button class="btn btn-cancel" onclick="spinRoulette('real')">Girar en "Top Rateados"</button>
      </div>
      <div id="roulette-result" style="margin-top:15px; font-weight:bold; text-align:center; color:var(--accent);">Presiona una opción para elegir un nivel al azar</div>
      <div class="modal-actions" style="margin-top:15px;"><button class="btn btn-submit" onclick="closeModal('modal-roulette')">Cerrar</button></div>
    </div>
  </div>

  <!-- Modal Auth -->
  <div id="modal-auth" class="modal">
    <div class="modal-content">
      <h2>Acceso Requerido</h2>
      <form onsubmit="verifyAdminAccess(event)">
        <div class="form-group"><label>Clave Admin:</label><input type="password" id="pre-admin-pass" required></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('modal-auth')">Cancelar</button>
          <button type="submit" class="btn btn-submit">Ingresar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Añadir Nivel Normal -->
  <div id="modal-add" class="modal">
    <div class="modal-content">
      <h2>Añadir Nivel Personalizado</h2>
      <form id="level-form" onsubmit="saveLevel(event)">
        <div class="form-group"><label>Top (1 a 2000)</label><input type="number" id="level-position" min="1" required></div>
        <div class="form-group"><label>Nombre del Nivel</label><input type="text" id="level-name" required></div>
        <div class="form-group"><label>Autor / Creador</label><input type="text" id="level-author" required></div>
        <div class="form-group"><label>Verificador</label><input type="text" id="level-verifier" required></div>
        <div class="form-group"><label>Progreso (%)</label><input type="number" id="level-progress" min="1" max="100" value="100"></div>
        <div class="form-group"><label>Link Video YouTube</label><input type="url" id="level-video-url"></div>
        <div class="form-group"><label>Imagen</label><input type="text" id="level-img-url"><input type="file" id="level-file" accept="image/*" style="margin-top:5px;"></div>
        <div class="form-group"><label>Nombre Canción</label><input type="text" id="level-song-name"></div>
        <div class="form-group"><label>ID Canción</label><input type="text" id="level-song-id"></div>
        <div class="form-group"><label>ID GD</label><input type="text" id="level-gd-id"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('modal-add')">Cancelar</button>
          <button type="submit" class="btn btn-submit">Guardar Nivel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Añadir Top Real (Rateado) -->
  <div id="modal-add-real" class="modal">
    <div class="modal-content">
      <h2>Añadir Nivel del Top Real (Rateado)</h2>
      <form onsubmit="saveRealLevel(event)">
        <div class="form-group"><label>Top Oficial (1 a 2000)</label><input type="number" id="real-position" min="1" required></div>
        <div class="form-group"><label>Nombre del Nivel Rateado</label><input type="text" id="real-name" required placeholder="Ej: Tidal Wave"></div>
        <div class="form-group"><label>Creador Oficial</label><input type="text" id="real-author" required placeholder="Ej: OniLink"></div>
        <div class="form-group">
          <label>Dificultad Demon</label>
          <select id="real-difficulty" required>
            <option value="hard">Hard Demon</option>
            <option value="insane">Insane Demon</option>
            <option value="extreme" selected>Extreme Demon</option>
          </select>
        </div>
        <div class="form-group"><label>Jugador con Récord</label><input type="text" id="real-gold-player" required placeholder="Nombre del jugador"></div>
        <div class="form-group"><label>Récord Alcanzado (%)</label><input type="number" id="real-gold-percent" min="1" max="100" value="100" required></div>
        <div class="form-group"><label>Link Video YouTube</label><input type="url" id="real-video-url"></div>
        <div class="form-group"><label>ID GD Oficial</label><input type="text" id="real-gd-id"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('modal-add-real')">Cancelar</button>
          <button type="submit" class="btn btn-submit">Guardar Rateado</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Añadir Jugador -->
  <div id="modal-add-player" class="modal">
    <div class="modal-content">
      <h2>Añadir Jugador</h2>
      <form id="player-form" onsubmit="savePlayer(event)">
        <div class="form-group"><label>Nombre Jugador</label><input type="text" id="player-name" required></div>
        <div class="form-group"><label>Foto Avatar</label><input type="text" id="player-img-url"><input type="file" id="player-file" accept="image/*" style="margin-top:5px;"></div>
        <div class="form-group"><label>Info / Detalles</label><input type="text" id="player-info"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" onclick="closeModal('modal-add-player')">Cancelar</button>
          <button type="submit" class="btn btn-submit">Guardar Jugador</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detalle Nivel / Modo Cine -->
  <div id="modal-detail" class="modal">
    <div class="modal-content">
      <h2 id="detail-title"></h2>
      <img id="detail-img" class="detail-img" src="">
      <div id="detail-info-list"></div>
      <div id="video-box" style="margin-top:10px; display:none;"><div class="video-container"><iframe id="detail-video" src="" allowfullscreen></iframe></div></div>
      <div class="modal-actions" style="margin-top:15px;"><button class="btn btn-cancel" onclick="closeModal('modal-detail')">Cerrar</button></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "6767XDXD";
    let currentTab = 'levels';
    let levels = [];
    let realLevels = [];
    let customPlayers = [];

    const DEMON_ICONS = {
      hard: 'https://images.wikia.nocookie.net/geometry-dash/images/c/c2/Hard_Demon.png',
      insane: 'https://images.wikia.nocookie.net/geometry-dash/images/d/d4/Insane_Demon.png',
      extreme: 'https://images.wikia.nocookie.net/geometry-dash/images/9/9e/Extreme_Demon.png'
    };

    function changeTheme(theme) { document.body.className = theme === 'default' ? '' : `theme-${theme}`; }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(`tab-${tab}-btn`).classList.add('active');
      document.getElementById(`${tab}-section`).classList.add('active');
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; if(id==='modal-detail') document.getElementById('detail-video').src=''; }

    function startAddProcess() { 
      document.getElementById('pre-admin-pass').value = ''; 
      openModal('modal-auth'); 
    }

    function verifyAdminAccess(e) {
      e.preventDefault();
      if(document.getElementById('pre-admin-pass').value === ADMIN_PASSWORD) {
        closeModal('modal-auth');
        if(currentTab === 'levels') openModal('modal-add');
        else if(currentTab === 'real') openModal('modal-add-real');
        else openModal('modal-add-player');
      } else alert("Clave incorrecta");
    }

    function getYouTubeId(url) {
      if(!url) return null;
      let match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function getYouTubeEmbedUrl(url) { const id = getYouTubeId(url); return id ? `https://www.youtube.com/embed/${id}` : null; }
    function getYouTubeThumbnail(url) { const id = getYouTubeId(url); return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null; }

    function calculatePlayerPoints(playerLevels, playerRealLevels) {
      let total = 0;
      playerLevels.forEach(l => {
        const rank = levels.indexOf(l) + 1;
        if(rank === 1) total += 400;
        else if(rank <= 5) total += 300;
        else if(rank <= 10) total += 200;
        else if(rank <= 100) total += 100;
        else total += 50;
      });

      playerRealLevels.forEach(rl => {
        const diff = rl.difficulty || 'extreme';
        if(diff === 'extreme') total += 500;
        else if(diff === 'insane') total += 300;
        else if(diff === 'hard') total += 150;
      });

      return total;
    }

    function spinRoulette(type) {
      let pool = type === 'mine' ? levels : realLevels;
      if(pool.length === 0) return alert("No hay niveles registrados en esta categoría.");
      const picked = pool[Math.floor(Math.random() * pool.length)];
      const rank = pool.indexOf(picked) + 1;
      document.getElementById('roulette-result').innerHTML = `🎯 Nivel Específico:<br><b>#${rank} - ${picked.name}</b> (${picked.author})`;
    }

    function exportData() {
      if(prompt("Clave admin:") === ADMIN_PASSWORD) {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ levels, realLevels, customPlayers }));
        const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "absolute_list_backup.json"); dl.click(); dl.remove();
      } else alert("Clave incorrecta");
    }

    function importData() {
      if(prompt("Clave admin:") === ADMIN_PASSWORD) {
        try {
          const parsed = JSON.parse(prompt("Pega el código JSON del backup:"));
          if(parsed.levels) localStorage.setItem('gd_absolute_list', JSON.stringify(parsed.levels));
          if(parsed.realLevels) localStorage.setItem('gd_absolute_real', JSON.stringify(parsed.realLevels));
          if(parsed.customPlayers) localStorage.setItem('gd_absolute_players', JSON.stringify(parsed.customPlayers));
          window.location.reload();
        } catch(e) { alert("JSON no válido."); }
      } else alert("Clave incorrecta");
    }

    function showChangelog() { alert("📜 Historial de Cambios:\n- Pestaña 'Absolute Levels' renombrada\n- Etiqueta de récords cambiada a 'Récord'\n- Almacenamiento local persistente sin borrar datos"); }

    async function saveLevel(e) {
      e.preventDefault();
      const videoUrl = document.getElementById('level-video-url').value;
      const fileInput = document.getElementById('level-file');
      const urlInput = document.getElementById('level-img-url').value;
      let finalImg = getYouTubeThumbnail(videoUrl) || (fileInput.files.length > 0 ? await readFileAsBase64(fileInput.files[0]) : urlInput) || "https://via.placeholder.com/400x200?text=GD";

      const targetPos = parseInt(document.getElementById('level-position').value);
      const newLevel = {
        id: Date.now(),
        name: document.getElementById('level-name').value,
        author: document.getElementById('level-author').value,
        verifier: document.getElementById('level-verifier').value,
        progress: parseInt(document.getElementById('level-progress').value) || 100,
        img: finalImg,
        songName: document.getElementById('level-song-name').value || "Desconocida",
        songId: document.getElementById('level-song-id').value || "N/A",
        videoUrl: videoUrl || "",
        gdId: document.getElementById('level-gd-id').value || "N/A"
      };

      let local = JSON.parse(localStorage.getItem('gd_absolute_list')) || [];
      local.splice(Math.min(Math.max(targetPos - 1, 0), local.length), 0, newLevel);
      localStorage.setItem('gd_absolute_list', JSON.stringify(local));
      window.location.reload();
    }

    async function saveRealLevel(e) {
      e.preventDefault();
      const videoUrl = document.getElementById('real-video-url').value;
      let finalImg = getYouTubeThumbnail(videoUrl) || "https://via.placeholder.com/400x200?text=Top+Real";

      const targetPos = parseInt(document.getElementById('real-position').value);
      const newReal = {
        id: Date.now(),
        name: document.getElementById('real-name').value,
        author: document.getElementById('real-author').value,
        difficulty: document.getElementById('real-difficulty').value,
        goldPlayer: document.getElementById('real-gold-player').value,
        goldPercent: parseInt(document.getElementById('real-gold-percent').value) || 100,
        img: finalImg,
        videoUrl: videoUrl || "",
        gdId: document.getElementById('real-gd-id').value || "N/A"
      };

      let localReal = JSON.parse(localStorage.getItem('gd_absolute_real')) || [];
      localReal.splice(Math.min(Math.max(targetPos - 1, 0), localReal.length), 0, newReal);
      localStorage.setItem('gd_absolute_real', JSON.stringify(localReal));
      window.location.reload();
    }

    function readFileAsBase64(f) {
      return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = e => rej(e); r.readAsDataURL(f); });
    }

    async function savePlayer(e) {
      e.preventDefault();
      const fileInput = document.getElementById('player-file');
      let finalImg = document.getElementById('player-img-url').value || (fileInput.files.length > 0 ? await readFileAsBase64(fileInput.files[0]) : "https://via.placeholder.com/150");
      let local = JSON.parse(localStorage.getItem('gd_absolute_players')) || [];
      local.push({ id: Date.now(), name: document.getElementById('player-name').value, img: finalImg, info: document.getElementById('player-info').value || "Jugador" });
      localStorage.setItem('gd_absolute_players', JSON.stringify(local));
      window.location.reload();
    }

    function showDetails(index, type='normal') {
      const lvl = type === 'normal' ? levels[index] : realLevels[index];
      document.getElementById('detail-title').innerText = `#${index + 1} - ${lvl.name}`;
      document.getElementById('detail-img').src = lvl.img;

      if(type === 'normal') {
        document.getElementById('detail-info-list').innerHTML = `
          <div class="detail-row"><span>Creador:</span> <b>${lvl.author}</b></div>
          <div class="detail-row"><span>Verificador:</span> <b>${lvl.verifier}</b></div>
          <div class="detail-row"><span>Canción:</span> <b>${lvl.songName} (${lvl.songId})</b></div>
          <div class="detail-row"><span>ID GD:</span> <b>${lvl.gdId}</b></div>
        `;
      } else {
        const demonImg = DEMON_ICONS[lvl.difficulty || 'extreme'];
        document.getElementById('detail-info-list').innerHTML = `
          <div class="detail-row"><span>Creador Oficial:</span> <b>${lvl.author}</b></div>
          <div class="detail-row"><span>Dificultad:</span> <img src="${demonImg}" class="demon-icon"></div>
          <div class="detail-row"><span>🏆 Récord:</span> <b style="color:var(--gold);">${lvl.goldPlayer} (${lvl.goldPercent}%)</b></div>
          <div class="detail-row"><span>ID GD:</span> <b>${lvl.gdId}</b></div>
        `;
      }

      const embed = getYouTubeEmbedUrl(lvl.videoUrl);
      document.getElementById('video-box').style.display = embed ? 'block' : 'none';
      if(embed) document.getElementById('detail-video').src = embed;
      openModal('modal-detail');
    }

    function render() {
      levels = JSON.parse(localStorage.getItem('gd_absolute_list')) || [];
      realLevels = JSON.parse(localStorage.getItem('gd_absolute_real')) || [];
      customPlayers = JSON.parse(localStorage.getItem('gd_absolute_players')) || [];
      const q = document.getElementById('search-bar').value.toLowerCase().trim();

      document.getElementById('stat-total-levels').innerText = levels.length;
      document.getElementById('stat-total-real').innerText = realLevels.length;

      // Render Absolute Levels
      const levelsDiv = document.getElementById('levels-list');
      levelsDiv.innerHTML = '';
      levels.filter(l => l.name.toLowerCase().includes(q) || l.verifier.toLowerCase().includes(q)).forEach(lvl => {
        const idx = levels.indexOf(lvl);
        levelsDiv.innerHTML += `
          <div class="card" onclick="showDetails(${idx}, 'normal')">
            <div class="rank">#${idx+1}</div>
            <img class="thumb" src="${lvl.img}">
            <div class="info">
              <h3>${lvl.name}</h3>
              <div class="meta-small">Creador: <b>${lvl.author}</b></div>
              <div class="meta-small">Pasado por: <b>${lvl.verifier} (${lvl.progress||100}%)</b></div>
            </div>
          </div>
        `;
      });

      // Render Top Real
      const realDiv = document.getElementById('real-list');
      realDiv.innerHTML = '';
      realLevels.filter(l => l.name.toLowerCase().includes(q) || l.goldPlayer.toLowerCase().includes(q)).forEach(lvl => {
        const idx = realLevels.indexOf(lvl);
        const demonImg = DEMON_ICONS[lvl.difficulty || 'extreme'];
        realDiv.innerHTML += `
          <div class="card top-gold" onclick="showDetails(${idx}, 'real')">
            <div class="rank" style="color:var(--gold);">#${idx+1}</div>
            <img class="thumb" src="${lvl.img}">
            <div class="info">
              <div class="info-header">
                <h3>${lvl.name}</h3>
                <img src="${demonImg}" class="demon-icon" alt="Demon">
              </div>
              <div class="meta-small">Creador: <b>${lvl.author}</b></div>
              <span class="gold-badge">🏆 Récord: ${lvl.goldPlayer} (${lvl.goldPercent}%)</span>
            </div>
          </div>
        `;
      });

      // Render Jugadores
      const playersDiv = document.getElementById('players-list');
      playersDiv.innerHTML = '';
      
      let pMapNormal = {}, pMapReal = {};
      levels.forEach(l => { if(!pMapNormal[l.verifier]) pMapNormal[l.verifier] = []; pMapNormal[l.verifier].push(l); });
      realLevels.forEach(l => { if(!pMapReal[l.goldPlayer]) pMapReal[l.goldPlayer] = []; pMapReal[l.goldPlayer].push(l); });

      const allPlayerNames = Array.from(new Set([...Object.keys(pMapNormal), ...Object.keys(pMapReal)]));
      const playerList = allPlayerNames.map(name => ({
        name,
        pts: calculatePlayerPoints(pMapNormal[name] || [], pMapReal[name] || []),
        countNormal: (pMapNormal[name] || []).length,
        countReal: (pMapReal[name] || []).length
      })).sort((a,b) => b.pts - a.pts);

      document.getElementById('stat-total-players').innerText = playerList.length;

      playerList.filter(p => p.name.toLowerCase().includes(q)).forEach((p, i) => {
        playersDiv.innerHTML += `
          <div class="card">
            <div class="rank">#${i+1}</div>
            <div class="info">
              <h3>${p.name}</h3>
              <div class="meta-small">Puntos Totales: <b>${p.pts} pts</b></div>
              <div class="meta-small">Absolute Levels: <b>${p.countNormal}</b> | Rateados Récord: <b>${p.countReal}</b></div>
            </div>
          </div>
        `;
      });
    }

    render();
  </script>
</body>
</html>
