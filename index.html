<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Absolute List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        
        :root {
            --bg: #121218;
            --bg-card: #1a1a22;
            --bg-hover: #242430;
            --text: #ffffff;
            --text-muted: #a0a0b0;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.6);
            --success: #10b981;
            --border: #2e2e3f;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --neon: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--accent), 0 0 40px var(--accent);
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
        }
        
        .title-container {
            text-align: center;
            margin: 2rem 0 3rem;
        }
        
        h1 {
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 800;
            letter-spacing: 0.3em;
            color: #ffffff;
            text-shadow: var(--neon);
            animation: neonPulse 2s ease-in-out infinite alternate;
            text-transform: uppercase;
        }
        
        @keyframes neonPulse {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--accent), 0 0 40px var(--accent); }
            to { text-shadow: 0 0 15px #fff, 0 0 30px #fff, 0 0 45px var(--accent), 0 0 60px var(--accent), 0 0 80px var(--accent); }
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.3rem;
            letter-spacing: 0.2em;
            margin-top: 1rem;
        }
        
        .menu-container {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 100;
        }
        
        .menu-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.6rem 1rem;
            color: var(--text);
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        
        .menu-btn:hover {
            background: var(--bg-hover);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        
        .menu-dropdown {
            position: absolute;
            right: 0;
            top: 100%;
            background: var(--bg-card);
            box-shadow: var(--shadow);
            border-radius: 12px;
            min-width: 220px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 0.5rem;
            backdrop-filter: blur(10px);
        }
        
        .menu-dropdown.show { display: block; animation: fadeIn 0.2s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .menu-item {
            padding: 0.9rem 1.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        
        .menu-item:hover {
            background: var(--bg-hover);
            padding-left: 1.8rem;
        }
        
        .divider {
            height: 1px;
            background: var(--border);
            margin: 0.3rem 0;
        }
        
        .category { margin-bottom: 3rem; }
        
        .category-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--border);
            color: var(--text);
        }
        
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }
        
        .level-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .level-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.25);
            border-color: var(--accent);
        }
        
        .level-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-hover);
        }
        
        .level-info { padding: 1.3rem; }
        
        .level-name {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        
        .level-author { color: var(--text-muted); font-size: 0.95rem; }
        
        .verified-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 0.75rem;
            padding: 0.25rem 0.7rem;
            border-radius: 20px;
            margin-left: 0.6rem;
            font-weight: 600;
        }
        
        .add-btn {
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }
        
        .add-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px var(--accent-glow);
        }
        
        .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .input-row input { flex: 1; margin: 0; }
        .search-btn {
            width: auto;
            margin: 0;
            padding: 0.9rem 1rem;
            white-space: nowrap;
            font-size: 0.9rem;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 1rem;
            backdrop-filter: blur(8px);
        }
        
        .modal.show { display: flex; }
        
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            animation: modalIn 0.3s ease;
        }
        
        .modal-box.large { max-width: 700px; }
        
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            font-weight: 700;
            color: var(--text);
        }
        
        .close-btn {
            float: right;
            background: var(--bg-hover);
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            margin: -0.5rem -0.5rem 0 0;
        }
        
        .close-btn:hover {
            background: var(--accent);
            color: white;
        }
        
        label {
            display: block;
            margin: 1.2rem 0 0.5rem;
            font-weight: 500;
            color: var(--text);
        }
        
        input, select, button {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--bg-hover);
            color: var(--text);
            transition: all 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        
        button {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 1rem;
            font-weight: 600;
        }
        
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        button.secondary {
            background: var(--bg-hover);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        button.danger { background: #dc2626; }
        
        .detail-thumbnail {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            background: var(--bg-hover);
            border: 1px solid var(--border);
        }
        
        .detail-name {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        
        .detail-meta {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .records-section { margin-top: 2rem; }
        
        .records-title {
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            color: var(--text);
        }
        
        .record-item {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        
        .record-item:hover { background: var(--bg-hover); }
        
        .record-complete {
            color: var(--success);
            font-weight: 600;
        }
        
        .admin-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .hidden { display: none !important; }
        
        .record-form-row {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            margin: 1rem 0;
            background: var(--bg-hover);
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1 id="main-title">The Absolute List</h1>
        <p class="subtitle" id="main-subtitle">Los Absolute Levels</p>
    </div>

    <div class="menu-container">
        <button class="menu-btn" id="menuBtn">⋮</button>
        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-item" id="adminBtn">🔐 Modo Admin</div>
            <div class="menu-item" id="discordBtn">💬 Discord</div>
            <div class="menu-item hidden" id="editDiscordBtn">✏️ Editar Discord</div>
            <div class="divider"></div>
            <!-- ✅ Nuevo: Cambiar categoría -->
            <div class="menu-item" id="switchAbsolute">⭐ Absolute Levels</div>
            <div class="menu-item" id="switchProgress">🚧 Niveles en Progreso</div>
            <div class="divider"></div>
            <div class="menu-item" id="langBtn">🌐 Cambiar Idioma</div>
        </div>
    </div>

    <!-- Categoría ACTIVA (cambia dinámicamente) -->
    <div class="category">
        <h2 class="category-title" id="cat-title">Los Absolute Levels</h2>
        <button class="add-btn hidden" id="addLevelBtn">➕ Añadir Nuevo Nivel</button>
        <div class="levels-grid" id="levelsContainer"></div>
    </div>

    <!-- MODAL: Contraseña -->
    <div class="modal" id="passwordModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('passwordModal')">&times;</button>
            <h3 class="modal-title" id="pass-title">Modo Admin</h3>
            <label id="pass-label">Contraseña:</label>
            <input type="password" id="adminPass" placeholder="Escribe la contraseña">
            <button onclick="checkPassword()" id="pass-submit">Entrar</button>
        </div>
    </div>

    <!-- MODAL: Añadir/Editar Nivel ABSOLUTO (con YouTube + Buscar ID) -->
    <div class="modal" id="levelModal">
        <div class="modal-box large">
            <button class="close-btn" onclick="closeModal('levelModal')">&times;</button>
            <h3 class="modal-title" id="level-form-title">Añadir Nivel</h3>
            
            <label id="lbl-name">Título del Nivel:</label>
            <input type="text" id="levelName" required>
            
            <label id="lbl-author">Autor:</label>
            <input type="text" id="levelAuthor" required>
            
            <label id="lbl-verif">¿Está verificado?</label>
            <select id="levelVerified" onchange="toggleVerifier()">
                <option value="no" id="opt-no">No</option>
                <option value="yes" id="opt-yes">Sí</option>
            </select>
            
            <div id="verifierRow" class="hidden">
                <label id="lbl-verifier">Nombre del verificador:</label>
                <input type="text" id="levelVerifier">
            </div>
            
            <label id="lbl-photo">Enlace de foto (opcional):</label>
            <input type="url" id="levelPhoto" placeholder="https://...">
            
            <!-- ✅ Campo YouTube + Botón Buscar ID -->
            <label id="lbl-yt">Enlace de YouTube / ID:</label>
            <div class="input-row">
                <input type="url" id="levelYt" placeholder="https://youtube.com/watch?v=... o ID">
                <button type="button" class="search-btn secondary" onclick="searchGD()">🔍 Buscar ID</button>
            </div>
            
            <h4 style="margin-top:1.8rem" id="lbl-records">Récords</h4>
            <div id="recordsList"></div>
            <button class="secondary" onclick="addRecord()" id="btn-add-record">+ Añadir Récord</button>
            
            <input type="hidden" id="editingId">
            <button onclick="saveLevel()" id="btn-save-level">Guardar Nivel</button>
        </div>
    </div>

    <!-- ✅ MODAL: Añadir/Editar Nivel EN PROGRESO (SIN YouTube ni ID) -->
    <div class="modal" id="progressModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('progressModal')">&times;</button>
            <h3 class="modal-title" id="progress-form-title">Nivel en Progreso</h3>
            
            <label>Nombre del Nivel:</label>
            <input type="text" id="progressName" required>
            
            <label>Autor:</label>
            <input type="text" id="progressAuthor" required>
            
            <label>Foto (opcional):</label>
            <input type="url" id="progressPhoto" placeholder="https://...">
            
            <input type="hidden" id="editingProgressId">
            <button onclick="saveProgressLevel()">Guardar</button>
        </div>
    </div>

    <!-- MODAL: Detalle del Nivel -->
    <div class="modal" id="detailModal">
        <div class="modal-box large">
            <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
            <img id="detailImg" class="detail-thumbnail" src="" alt="">
            <h2 class="detail-name" id="detailName"></h2>
            <p class="detail-meta" id="detailMeta"></p>
            
            <div class="records-section" id="detailRecordsSection">
                <h4 class="records-title" id="lbl-records-list">Récords</h4>
                <div id="detailRecords"></div>
            </div>
            
            <div class="admin-actions hidden" id="detailAdminActions">
                <button class="secondary" id="btn-edit-level" onclick="editCurrentLevel()">✏️ Editar</button>
                <button class="danger" id="btn-delete-level" onclick="deleteCurrentLevel()">🗑️ Borrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Editar Discord -->
    <div class="modal" id="discordModal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeModal('discordModal')">&times;</button>
            <h3 class="modal-title" id="discord-title">Enlace de Discord</h3>
            <label id="lbl-discord-link">Enlace del servidor de Discord:</label>
            <input type="url" id="discordLink" placeholder="https://discord.gg/...">
            <button onclick="saveDiscord()" id="btn-save-discord">Guardar Enlace</button>
        </div>
    </div>

<script>
let isAdmin = false;
let lang = localStorage.getItem('listLang') || 'es';
let currentDetailId = null;
let recordEntries = [];
let currentCategory = 'absolute'; // ✅ 'absolute' o 'progress'

const T = {
    es: {
        title: 'The Absolute List',
        subtitle: 'Los Absolute Levels',
        catAbsolute: '⭐ Los Absolute Levels',
        catProgress: '🚧 Niveles en Progreso',
        admin: '🔐 Modo Admin',
        discord: '💬 Discord',
        editDiscord: '✏️ Editar Discord',
        lang: '🌐 Cambiar a Inglés',
        passPrompt: 'Modo Admin',
        passLabel: 'Contraseña:',
        passSubmit: 'Entrar',
        passWrong: 'Contraseña incorrecta',
        addLevel: '+ Añadir Nuevo Nivel',
        addProgress: '+ Añadir Nivel en Progreso',
        editLevel: 'Editar Nivel',
        name: 'Título del Nivel:',
        author: 'Autor:',
        verified: '¿Está verificado?',
        no: 'No',
        yes: 'Sí',
        verifier: 'Nombre del verificador:',
        photo: 'Enlace de foto (opcional):',
        ytLink: 'Enlace de YouTube / ID:',
        searchGD: '🔍 Buscar ID',
        noTitle: '⚠️ Escribe primero el nombre del nivel para buscar',
        records: 'Récords',
        addRecord: '+ Añadir Récord',
        save: 'Guardar Nivel',
        recordsTitle: 'Récords',
        complete: 'Completado',
        edit: '✏️ Editar',
        delete: '🗑️ Borrar',
        discordTitle: 'Enlace de Discord',
        discordLabel: 'Enlace del servidor de Discord:',
        saveDiscord: 'Guardar Enlace',
        openDiscord: 'Abrir Discord',
        nameRecord: 'Nombre del jugador',
        recordVal: 'Récord (ej: 100%, 0:45)',
        isComplete: '¿Lo completó?',
        deleteConfirm: '¿Seguro que quieres borrar este nivel?',
        fillRequired: 'Debes poner enlace de YouTube',
        noRecords: 'Sin récords registrados',
        noYtNeeded: '(No requiere enlace de YouTube)'
    },
    en: {
        title: 'The Absolute List',
        subtitle: 'The Absolute Levels',
        catAbsolute: '⭐ The Absolute Levels',
        catProgress: '🚧 Levels in Progress',
        admin: '🔐 Admin Mode',
        discord: '💬 Discord',
        editDiscord: '✏️ Edit Discord',
        lang: '🌐 Switch to Spanish',
        passPrompt: 'Admin Mode',
        passLabel: 'Password:',
        passSubmit: 'Enter',
        passWrong: 'Incorrect password',
        addLevel: '+ Add New Level',
        addProgress: '+ Add Level in Progress',
        editLevel: 'Edit Level',
        name: 'Level Title:',
        author: 'Author:',
        verified: 'Verified?',
        no: 'No',
        yes: 'Yes',
        verifier: 'Verifier Name:',
        photo: 'Photo link (optional):',
        ytLink: 'YouTube Link / ID:',
        searchGD: '🔍 Search ID',
        noTitle: '⚠️ Write the level name first before searching',
        records: 'Records',
        addRecord: '+ Add Record',
        save: 'Save Level',
        recordsTitle: 'Records',
        complete: 'Completed',
        edit: '✏️ Edit',
        delete: '🗑️ Delete',
        discordTitle: 'Discord Link',
        discordLabel: 'Discord Server Link:',
        saveDiscord: 'Save Link',
        openDiscord: 'Open Discord',
        nameRecord: 'Player Name',
        recordVal: 'Record (e.g. 100%, 0:45)',
        isComplete: 'Completed?',
        deleteConfirm: 'Are you sure you want to delete this level?',
        fillRequired: 'YouTube link is required',
        noRecords: 'No records yet',
        noYtNeeded: '(No YouTube link needed)'
    }
};

document.addEventListener('DOMContentLoaded', () => {
    applyLang();
    renderLevels();
    setupMenu();
    document.getElementById('addLevelBtn').addEventListener('click', openAddLevel);
});

function setupMenu() {
    const btn = document.getElementById('menuBtn');
    btn.addEventListener('click', e => {
        e.stopPropagation();
        document.getElementById('menuDropdown').classList.toggle('show');
    });
    document.addEventListener('click', () => {
        document.getElementById('menuDropdown').classList.remove('show');
    });
    
    document.getElementById('adminBtn').onclick = () => openModal('passwordModal');
    document.getElementById('discordBtn').onclick = openDiscord;
    document.getElementById('editDiscordBtn').onclick = () => {
        const link = localStorage.getItem('discordLink') || '';
        document.getElementById('discordLink').value = link;
        openModal('discordModal');
    };
    document.getElementById('langBtn').onclick = toggleLang;
    
    // ✅ Cambiar categoría
    document.getElementById('switchAbsolute').onclick = () => switchCategory('absolute');
    document.getElementById('switchProgress').onclick = () => switchCategory('progress');
}

// ✅ Cambiar entre categorías
function switchCategory(cat) {
    currentCategory = cat;
    document.getElementById('menuDropdown').classList.remove('show');
    renderLevels();
    updateAdminUI();
}

function applyLang() {
    const t = T[lang];
    document.getElementById('main-title').textContent = t.title;
    document.getElementById('main-subtitle').textContent = t.subtitle;
    document.getElementById('switchAbsolute').textContent = t.catAbsolute;
    document.getElementById('switchProgress').textContent = t.catProgress;
    document.getElementById('adminBtn').textContent = t.admin;
    document.getElementById('discordBtn').textContent = t.discord;
    document.getElementById('editDiscordBtn').textContent = t.editDiscord;
    document.getElementById('langBtn').textContent = t.lang;
    document.getElementById('pass-title').textContent = t.passPrompt;
    document.getElementById('pass-label').textContent = t.passLabel;
    document.getElementById('pass-submit').textContent = t.passSubmit;
    document.getElementById('lbl-name').textContent = t.name;
    document.getElementById('lbl-author').textContent = t.author;
    document.getElementById('lbl-verif').textContent = t.verified;
    document.getElementById('opt-no').textContent = t.no;
    document.getElementById('opt-yes').textContent = t.yes;
    document.getElementById('lbl-verifier').textContent = t.verifier;
    document.getElementById('lbl-photo').textContent = t.photo;
    document.getElementById('lbl-yt').textContent = t.ytLink;
    document.getElementById('btn-add-record').textContent = t.addRecord;
    document.getElementById('btn-save-level').textContent = t.save;
    document.getElementById('lbl-records-list').textContent = t.recordsTitle;
    document.getElementById('btn-edit-level').textContent = t.edit;
    document.getElementById('btn-delete-level').textContent = t.delete;
    document.getElementById('discord-title').textContent = t.discordTitle;
    document.getElementById('lbl-discord-link').textContent = t.discordLabel;
    document.getElementById('btn-save-discord').textContent = t.saveDiscord;
    updateCatTitle();
    updateAdminUI();
}

function updateCatTitle() {
    document.getElementById('cat-title').textContent = T[lang][currentCategory === 'absolute' ? 'catAbsolute' : 'catProgress'];
}

function toggleLang() {
    lang = lang === 'es' ? 'en' : 'es';
    localStorage.setItem('listLang', lang);
    applyLang();
    renderLevels();
}

function checkPassword() {
    const pass = document.getElementById('adminPass').value;
    if (pass === '6767XDXD') {
        isAdmin = true;
        closeModal('passwordModal');
        updateAdminUI();
        document.getElementById('adminPass').value = '';
    } else {
        alert(T[lang].passWrong);
    }
}

function updateAdminUI() {
    const t = T[lang];
    const addBtn = document.getElementById('addLevelBtn');
    
    if (isAdmin) {
        document.getElementById('adminBtn').textContent = '🚪 Salir Admin';
        document.getElementById('adminBtn').onclick = () => {
            isAdmin = false;
            updateAdminUI();
            renderLevels();
        };
        document.getElementById('editDiscordBtn').classList.remove('hidden');
        addBtn.classList.remove('hidden');
        addBtn.textContent = currentCategory === 'absolute' ? t.addLevel : t.addProgress;
    } else {
        document.getElementById('adminBtn').textContent = t.admin;
        document.getElementById('adminBtn').onclick = () => openModal('passwordModal');
        document.getElementById('editDiscordBtn').classList.add('hidden');
        addBtn.classList.add('hidden');
    }
    updateCatTitle();
}

// ✅ Buscar en GD Browser
function searchGD() {
    const name = document.getElementById('levelName').value.trim();
    if (!name) {
        alert(T[lang].noTitle);
        return;
    }
    window.open(`https://gdbrowser.com/search?query=${encodeURIComponent(name)}`, '_blank');
}

function openDiscord() {
    const link = localStorage.getItem('discordLink');
    if (link) window.open(link, '_blank');
    else alert(lang === 'es' ? 'El enlace aún no está configurado' : 'Link not set yet');
}

function saveDiscord() {
    const link = document.getElementById('discordLink').value.trim();
    localStorage.setItem('discordLink', link);
    closeModal('discordModal');
}

// ===== NIVELES ABSOLUTOS =====
function getLevels() {
    return JSON.parse(localStorage.getItem('absoluteLevels') || '[]');
}

function saveLevels(levels) {
    localStorage.setItem('absoluteLevels', JSON.stringify(levels));
}

// ===== NIVELES EN PROGRESO =====
function getProgressLevels() {
    return JSON.parse(localStorage.getItem('progressLevels') || '[]');
}

function saveProgressLevels(levels) {
    localStorage.setItem('progressLevels', JSON.stringify(levels));
}

// ===== RENDERIZAR =====
function renderLevels() {
    updateCatTitle();
    const container = document.getElementById('levelsContainer');
    
    if (currentCategory === 'absolute') {
        renderAbsolute(container);
    } else {
        renderProgress(container);
    }
}

function renderAbsolute(container) {
    const levels = getLevels();
    container.innerHTML = '';
    
    levels.forEach(level => {
        const card = document.createElement('div');
        card.className = 'level-card';
        card.onclick = () => openDetail(level.id, 'absolute');
        
        const thumb = level.photo || getYtThumb(level.ytLink) || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><rect fill="%23242430" width="400" height="225"/></svg>';
        
        card.innerHTML = `
            <img src="${thumb}" class="level-thumbnail" alt="">
            <div class="level-info">
                <div class="level-name">${escapeHtml(level.name)}</div>
                <div class="level-author">${escapeHtml(level.author)}${level.verified === 'yes' ? `<span class="verified-tag">✓ ${escapeHtml(level.verifier || '')}</span>` : ''}</div>
            </div>
        `;
        container.appendChild(card);
    });
}

function renderProgress(container) {
    const levels = getProgressLevels();
    container.innerHTML = '';
    
    levels.forEach(level => {
        const card = document.createElement('div');
        card.className = 'level-card';
        card.onclick = () => openDetail(level.id, 'progress');
        
        const thumb = level.photo || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><rect fill="%23242430" width="400" height="225"/></svg>';
        
        card.innerHTML = `
            <img src="${thumb}" class="level-thumbnail" alt="">
            <div class="level-info">
                <div class="level-name">${escapeHtml(level.name)}</div>
                <div class="level-author">${escapeHtml(level.author)}</div>
            </div>
        `;
        container.appendChild(card);
    });
}

function getYtThumb(url) {
    if (!url) return null;
    const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\s]+)/);
    return m ? `https://img.youtube.com/vi/${m[1]}/hqdefault.jpg` : null;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
}

// ===== ABRIR FORMULARIO SEGÚN CATEGORÍA =====
function openAddLevel() {
    if (currentCategory === 'absolute') {
        openAddAbsolute();
    } else {
        openAddProgress();
    }
}

// ===== ABSOLUTO =====
function openAddAbsolute() {
    recordEntries = [];
    document.getElementById('editingId').value = '';
    document.getElementById('levelName').value = '';
    document.getElementById('levelAuthor').value = '';
    document.getElementById('levelVerified').value = 'no';
    document.getElementById('levelVerifier').value = '';
    document.getElementById('levelPhoto').value = '';
    document.getElementById('levelYt').value = '';
    document.getElementById('level-form-title').textContent = T[lang].addLevel;
    document.getElementById('verifierRow').classList.add('hidden');
    document.getElementById('detailRecordsSection').style.display = '';
    renderRecordsForm();
    openModal('levelModal');
}

function toggleVerifier() {
    document.getElementById('verifierRow').classList.toggle('hidden', document.getElementById('levelVerified').value !== 'yes');
}

function addRecord() {
    recordEntries.push({ name: '', record: '', complete: false });
    renderRecordsForm();
}

function removeRecord(index) {
    recordEntries.splice(index, 1);
    renderRecordsForm();
}

function renderRecordsForm() {
    const container = document.getElementById('recordsList');
    const t = T[lang];
    container.innerHTML = recordEntries.map((r, i) => `
        <div class="record-form-row">
            <button class="close-btn" style="margin-top:0" onclick="removeRecord(${i})">&times;</button>
            <label>${t.nameRecord}</label>
            <input type="text" value="${escapeHtml(r.name)}" onchange="recordEntries[${i}].name = this.value">
            <label>${t.recordVal}</label>
            <input type="text" value="${escapeHtml(r.record)}" onchange="recordEntries[${i}].record = this.value">
            <label style="display:inline-flex; align-items:center; gap:0.5rem; margin-top:0.5rem;">
                <input type="checkbox" ${r.complete ? 'checked' : ''} onchange="recordEntries[${i}].complete = this.checked">
                ${t.isComplete}
            </label>
        </div>
    `).join('');
}

function saveLevel() {
    const t = T[lang];
    const ytLink = document.getElementById('levelYt').value.trim();
    
    if (!ytLink) {
        alert(t.fillRequired);
        return;
    }
    
    const levelData = {
        id: document.getElementById('editingId').value || Date.now().toString(),
        name: document.getElementById('levelName').value.trim(),
        author: document.getElementById('levelAuthor').value.trim(),
        verified: document.getElementById('levelVerified').value,
        verifier: document.getElementById('levelVerifier').value.trim(),
        photo: document.getElementById('levelPhoto').value.trim(),
        ytLink: ytLink,
        records: [...recordEntries]
    };
    
    let levels = getLevels();
    const idx = levels.findIndex(l => l.id === levelData.id);
    if (idx >= 0) levels[idx] = levelData;
    else levels.push(levelData);
    
    saveLevels(levels);
    closeModal('levelModal');
    renderLevels();
}

// ===== PROGRESO =====
function openAddProgress() {
    document.getElementById('editingProgressId').value = '';
    document.getElementById('progressName').value = '';
    document.getElementById('progressAuthor').value = '';
    document.getElementById('progressPhoto').value = '';
    openModal('progressModal');
}

function saveProgressLevel() {
    const levelData = {
        id: document.getElementById('editingProgressId').value || Date.now().toString(),
        name: document.getElementById('progressName').value.trim(),
        author: document.getElementById('progressAuthor').value.trim(),
        photo: document.getElementById('progressPhoto').value.trim()
    };
    
    let levels = getProgressLevels();
    const idx = levels.findIndex(l => l.id === levelData.id);
    if (idx >= 0) levels[idx] = levelData;
    else levels.push(levelData);
    
    saveProgressLevels(levels);
    closeModal('progressModal');
    renderLevels();
}

// ===== DETALLE =====
let detailCategory = 'absolute';

function openDetail(id, cat) {
    currentDetailId = id;
    detailCategory = cat;
    const t = T[lang];
    let level, thumb, meta;
    
    if (cat === 'absolute') {
        level = getLevels().find(l => l.id === id);
        if (!level) return;
        thumb = level.photo || getYtThumb(level.ytLink) || '';
        meta = `${lang === 'es' ? 'Por' : 'By'} ${level.author}`;
        if (level.verified === 'yes') meta += ` | ${lang === 'es' ? 'Verificado por' : 'Verified by'} ${level.verifier}`;
        
        document.getElementById('detailRecordsSection').style.display = 'block';
        const recordsContainer = document.getElementById('detailRecords');
        if (level.records?.length) {
            recordsContainer.innerHTML = level.records.map(r => `
                <div class="record-item ${r.complete ? 'record-complete' : ''}">
                    <strong>${escapeHtml(r.name)}</strong> — ${escapeHtml(r.record)}
                    ${r.complete ? ` ✅ ${t.complete}` : ''}
                </div>
            `).join('');
        } else {
            recordsContainer.innerHTML = `<p style="color:#a0a0b0">${t.noRecords}</p>`;
        }
    } else {
        level = getProgressLevels().find(l => l.id === id);
        if (!level) return;
        thumb = level.photo || '';
        meta = `${lang === 'es' ? 'Autor:' : 'Author:'} ${level.author}`;
        document.getElementById('detailRecordsSection').style.display = 'none';
    }
    
    document.getElementById('detailImg').src = thumb;
    document.getElementById('detailName').textContent = level.name;
    document.getElementById('detailMeta').textContent = meta;
    document.getElementById('detailAdminActions').classList.toggle('hidden', !isAdmin);
    openModal('detailModal');
}

function editCurrentLevel() {
    closeModal('detailModal');
    
    if (detailCategory === 'absolute') {
        const level = getLevels().find(l => l.id === currentDetailId);
        if (!level) return;
        
        document.getElementById('editingId').value = level.id;
        document.getElementById('levelName').value = level.name;
        document.getElementById('levelAuthor').value = level.author;
        document.getElementById('levelVerified').value = level.verified;
        document.getElementById('levelVerifier').value = level.verifier || '';
        document.getElementById('levelPhoto').value = level.photo || '';
        document.getElementById('levelYt').value = level.ytLink || '';
        document.getElementById('level-form-title').textContent = T[lang].editLevel;
        document.getElementById('verifierRow').classList.toggle('hidden', level.verified !== 'yes');
        recordEntries = level.records ? [...level.records] : [];
        renderRecordsForm();
        openModal('levelModal');
    } else {
        const level = getProgressLevels().find(l => l.id === currentDetailId);
        if (!level) return;
        
        document.getElementById('editingProgressId').value = level.id;
        document.getElementById('progressName').value = level.name;
        document.getElementById('progressAuthor').value = level.author;
        document.getElementById('progressPhoto').value = level.photo || '';
        openModal('progressModal');
    }
}

function deleteCurrentLevel() {
    if (!confirm(T[lang].deleteConfirm)) return;
    
    if (detailCategory === 'absolute') {
        saveLevels(getLevels().filter(l => l.id !== currentDetailId));
    } else {
        saveProgressLevels(getProgressLevels().filter(l => l.id !== currentDetailId));
    }
    closeModal('detailModal');
    renderLevels();
}

function openModal(id) {
    document.getElementById(id).classList.add('show');
    document.getElementById('menuDropdown').classList.remove('show');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}
</script>
